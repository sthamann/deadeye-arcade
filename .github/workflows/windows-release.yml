name: Windows installer release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS compiler
        run: choco install nsis --yes --no-progress
      - name: Build and verify installer
        shell: pwsh
        run: |
          [xml]$project=Get-Content src/Reaper.Windows/Reaper.Windows.csproj
          $version=$project.Project.PropertyGroup.Version
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version"){throw 'Tag must match application version'}
          ./scripts/build-windows.ps1
      - name: Publish installable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project=Get-Content src/Reaper.Windows/Reaper.Windows.csproj
          $version=$project.Project.PropertyGroup.Version
          $tag="v$version"
          gh release view $tag 2>$null
          if($LASTEXITCODE -ne 0){gh release create $tag --target $env:GITHUB_SHA --title "Deadeye Arcade $version" --notes-file docs/release-notes.md}
          if($LASTEXITCODE -ne 0){throw 'Release creation failed'}
          gh release upload $tag "release/Deadeye-Arcade-$version-Setup-x64.exe" "release/Deadeye-Arcade-$version-Windows-x64.zip" "release/SHA256SUMS-$version.txt" --clobber
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
